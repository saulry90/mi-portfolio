[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Misma versión mayor que en desarrollo local (v22) para que el build en
  # Netlify no dependa del default cambiante de la plataforma (Vite 7 pide >=20.19).
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # Content Security Policy: solo recursos propios ('self') + Formspree.
    # script-src sin 'unsafe-inline' (bloquea XSS). style-src 'unsafe-inline'
    # necesario por el <style> que inyecta FontAwesome y el honeypot inline.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirige HTTP -> HTTPS (301). Netlify ya lo hace por defecto en su edge (antes
# de que se procesen las reglas); esta es defensa en profundidad documentada.
[[redirects]]
  from = "http://portfolio-saul.netlify.app/*"
  to = "https://portfolio-saul.netlify.app/:splat"
  status = 301
  force = true
